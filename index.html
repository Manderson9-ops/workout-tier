    <div><span class="g">${dd.scale?'●':it.g}</span><span class="n">${esc(it.n)}</span></div>
    <div class="chips">${lv}${tg}</div>
    <div class="detail">${esc(it.w)}<br><a href="${link(it.vid,it.s)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">▶ 영상 ${it.ts} 부터 보기</a></div>
  </div>`;
}
function renderTopic(key){
  const d=DATA[key], vs=V[key];
  const items=d.items.filter(pass).sort((a,b)=>rk(d,a.g)-rk(d,b.g));
  let h='<div class="vinfo">출처 영상: '+vs.map(v=>`<a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener">${esc(v.title)}</a> · ${esc(v.channel)} · ${v.date}`).join('<br>')+'</div>';
  if(d.scale){
    d.scale.forEach((lab,si)=>{
      const its=items.filter(i=>i.g===lab); if(!its.length) return;
      h+=`<div class="tier ${clsOf(si,d.scale.length)}"><div class="lab sc">${esc(lab)}</div><div class="items">${its.map(i=>card(i,key)).join('')}</div></div>`;
    });
  } else
  for(const r of ROWS){
    const its=items.filter(i=>i.g[0]===r);
    if(!its.length && (r==='C'||r==='F') ) { if(!d.items.some(i=>i.g[0]===r)) continue; }
    h+=`<div class="tier ${r}"><div class="lab">${r}</div><div class="items">${its.length?its.map(i=>card(i,key)).join(''):'<span class="empty">해당 없음</span>'}</div></div>`;
  }
  if(d.unr&&d.unr.length){
    h+=`<div class="unr"><h3>티어 외 참고 항목</h3><ul>`+
      d.unr.map(u=>`<li><b>${esc(u.n)}</b> - ${esc(u.t)} <a href="${link(u.vid,u.s)}" target="_blank" rel="noopener">▶ ${u.ts}</a></li>`).join('')+`</ul></div>`;
  }
  return h;
}
function renderOverview(){
  let h='<div class="ov">';
  for(const k of Object.keys(DATA)){
    const top0=DATA[k].scale?DATA[k].scale[0]:'S';
    const tops=DATA[k].items.filter(pass).filter(i=>i.g===top0);
    h+=`<div class="ovc"><h3>${DATA[k].label} · ${DATA[k].scale?esc(DATA[k].scale[0]):'S티어'}</h3>`+
      (tops.length?tops.map(i=>`<div class="pick"><b>${esc(i.n)}</b>${(i.lv&&i.lv.length)?` <span class="chip lvc">${i.lv.join('·')}</span>`:''}<small>${esc(i.tg||'')}</small></div>`).join(''):'<div class="pick"><small>선택한 수준에 해당하는 S티어 없음</small></div>')+
      `<div class="go" data-go="${k}">전체 티어 보기 →</div></div>`;
  }
  h+='</div><div class="unr"><h3>이렇게 읽으세요</h3><ul><li>수준 버튼(초보/중급/상급)을 누르면 그 수준에 해당하는 평가만 보입니다. 수준 구분이 없는 항목은 항상 보입니다.</li><li>같은 운동이 수준·목적에 따라 여러 번 나올 수 있습니다(예: 언더그립 풀업은 초보 A+, 중상급 B+).</li><li>각 카드의 "▶ 영상 mm:ss" 링크는 해당 발언 지점으로 이동합니다.</li></ul></div>';
  return h;
}
const TYPE={new_video:'새 영상',tier_change:'티어 변경',new_item:'항목 추가',removed_item:'항목 삭제'};
function renderUpdates(){
  if(!APP.updates.length) return '<div class="unr">아직 업데이트가 없습니다.</div>';
  return '<div class="unr"><h3>최근 업데이트</h3><ul>'+APP.updates.map(e=>{
    const arrow=e.dir==='up'?' ▲':e.dir==='down'?' ▼':'';
    return '<li>'+e.date.slice(0,10)+' · <b>'+esc(e.topic)+'</b> · '+(TYPE[e.type]||e.type)+arrow+' - '+esc(e.detail)+' <a href="https://www.youtube.com/watch?v='+e.vid+'" target="_blank" rel="noopener">영상</a></li>';
  }).join('')+'</ul></div>';
}
function render(){
  renderNav();
  $('#main').innerHTML = tab==='overview'?renderOverview():tab==='updates'?renderUpdates():renderTopic(tab);
  document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>{tab=e.dataset.go;render();window.scrollTo(0,0)});
}
$('#q').oninput=e=>{q=e.target.value.trim();render()};
document.getElementById('gen').textContent='업데이트 '+APP.generated_at.slice(0,10)+' · v'+APP.version;
render();
</script>
</body>
</html>
