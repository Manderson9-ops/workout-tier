function pass(it){
  if(level!=='전체' && it.lv && it.lv.length && !it.lv.includes(level)) return false;

function card(it,key){

function renderTopic(key){

  let h='<div class="vinfo">출처 영상: '+vs.map(v=>`<a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener">${esc(v.title)}</a> · ${esc(v.channel)} · ${v.date}`).join('<br>')+'</div>';
  for(const r of ROWS){
