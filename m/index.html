const LS = {get:(k,d)=>{try{const v=localStorage.getItem('tier.'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem('tier.'+k,JSON.stringify(v))}catch(e){}}};
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ORDER=['S+','S','S-','A+','A','A-','B+','B','B-','C+','C','C-','D+','D','D-','F'];
const ROWS=['S','A','B','C','D','F'];
const CLS=['S','A','B','C','D','F'];
function clsOf(i,n){return CLS[n<2?0:Math.round(i*5/(n-1))]}
function rk(t,g){return t.scale?t.scale.indexOf(g):ORDER.indexOf(g)}
const TYPE={new_video:'새 영상',tier_change:'티어 변경',new_item:'항목 추가',removed_item:'항목 삭제'};
const topics=APP.topics, byKey=Object.fromEntries(topics.map(t=>[t.key,t]));
const state={view:'home',topic:LS.get('topic',topics[0].key),level:LS.get('level','전체'),q:'',open:new Set()};
let seenPrev=LS.get('seenAt',null);
if(!byKey[state.topic]) state.topic=topics[0].key;

function parseHash(){
  const p=location.hash.replace(/^#\/?/,'').split('/');
  if(p[0]==='tier'){state.view='tier'; if(byKey[p[1]]) state.topic=p[1];}
  else if(p[0]==='updates') state.view='updates';
  else state.view='home';
}
function go(view,topic){location.hash='#/'+view+(topic?'/'+topic:'')}
function ytLink(vid,s){return 'https://www.youtube.com/watch?v='+vid+'&t='+s+'s'}
function pass(it){
  if(state.level!=='전체'&&it.lv.length&&!it.lv.includes(state.level))return false;
  if(state.q&&!(it.n+' '+it.tg).toLowerCase().includes(state.q.toLowerCase()))return false;
  return true;
}
function unseenCount(){ const s=LS.get('seenAt',null); if(!s) return 0; return APP.updates.filter(e=>e.date>s).length }

function renderChrome(){
  $('#upd').textContent='업데이트 '+APP.generated_at.slice(0,10)+' · v'+APP.version;
  const showF=state.view==='tier'||state.view==='home';
  $('#topics').style.display=state.view==='tier'?'flex':'none';
  $('#levels').style.display=showF?'flex':'none';
  $('#sbtn').style.visibility=state.view==='tier'?'visible':'hidden';
  $('#topics').innerHTML=topics.map(t=>`<button class="chip ${state.topic===t.key?'on':''}" data-topic="${t.key}">${esc(t.label)}</button>`).join('');
  $('#levels').innerHTML='<span class="lab">내 수준</span>'+['전체','초보','중급','상급'].map(l=>`<button class="chip ${state.level===l?'on':''}" data-level="${l}">${l}</button>`).join('');
  const n=unseenCount();
  $('#nav').innerHTML=[['home','&#127968;','홈'],['tier','&#127942;','티어'],['updates','&#128276;','업데이트']].map(([k,i,l])=>
    `<button class="${state.view===k?'on':''}" data-view="${k}"><i>${i}</i>${l}${k==='updates'&&n?`<span class="dot">${n}</span>`:''}</button>`).join('');
  requestAnimationFrame(()=>document.documentElement.style.setProperty('--hh',$('#hd').offsetHeight+'px'));
}
function itemCard(it,i){
  const T=byKey[state.topic], sc=T.scale;
  const gc=sc?clsOf(sc.indexOf(it.g),sc.length):it.g[0];
  const id=it.vid+'|'+it.n+'|'+it.tg+'|'+it.lv.join(',')+'|'+it.g;
  const lv=it.lv.length?`<span class="tg lv">${it.lv.join('·')}</span>`:'';
  const tg=it.tg?`<span class="tg">${esc(it.tg)}</span>`:'';
  return `<article class="it ${state.open.has(id)?'open':''}" data-id="${esc(id)}">
    <button class="it-h" data-toggle aria-expanded="${state.open.has(id)}">
      <span class="gr ${gc}">${sc?'●':it.g}</span>
      <span class="tx"><b>${esc(it.n)}</b><span class="tags">${lv}${tg}</span></span><span class="chev">&#9656;</span></button>
    <div class="it-b"><p>${esc(it.w)}</p><a class="yt" href="${ytLink(it.vid,it.s)}">&#9654; 영상 ${it.ts} 부터 보기</a></div></article>`;
}
function renderTier(){
  const t=byKey[state.topic];
  const items=t.items.filter(pass).sort((a,b)=>rk(t,a.g)-rk(t,b.g));
  let h='<div class="note">티어는 영상 진행자의 주관적 판단이며 검증된 합의가 아닙니다. 통증·부상이 있으면 전문가와 상의하세요.</div>';
  if(!items.length) h+='<div class="empty">조건에 맞는 항목이 없어요</div>';
  if(t.scale){
    t.scale.forEach((lab,si)=>{
      const its=items.filter(i=>i.g===lab); if(!its.length) return;
      const c=clsOf(si,t.scale.length);
      h+=`<section class="tier"><h3 class="th ${c}" style="font-size:1.05rem">${esc(lab)}<em>${its.length}개</em></h3>${its.map(itemCard).join('')}</section>`;
    });
  } else
  for(const r of ROWS){
    const its=items.filter(i=>i.g[0]===r);
    if(!its.length)continue;
    h+=`<section class="tier"><h3 class="th ${r}">${r}<em>${its.length}개</em></h3>${its.map(itemCard).join('')}</section>`;
  }
  if(t.unrated.length&&!state.q){
    h+='<section class="tier"><h3 class="th F" style="background:var(--sub)">참고<em>티어 미평가</em></h3>'+
      t.unrated.map(u=>`<div class="it un"><b>${esc(u.n)}</b>${esc(u.t)} <a href="${ytLink(u.vid,u.s)}">&#9654; ${u.ts}</a></div>`).join('')+'</section>';
  }
  h+='<div class="src">출처: '+t.videos.map(v=>`<a href="https://www.youtube.com/watch?v=${v.id}">${esc(v.title)}</a> (${esc(v.channel)}, ${v.date})`).join('<br>')+'</div>';
  return h;
}
function renderHome(){
  let h='<div class="note">S티어 요약입니다. 카드를 누르면 전체 티어로 이동해요.</div>';
  for(const t of topics){
    const top0=t.scale?t.scale[0]:'S';
    const tops=t.items.filter(i=>i.g===top0&&(state.level==='전체'||!i.lv.length||i.lv.includes(state.level)));
    h+=`<div class="card" data-goto="${t.key}"><h2>${esc(t.label)} · ${t.scale?esc(top0):'S티어'}<span>전체 보기 &#8250;</span></h2>`+
      (tops.length?tops.map(i=>`<div class="pick"><span class="gr S">${t.scale?'●':'S'}</span><div><b>${esc(i.n)}</b><small>${esc(i.tg)}${i.lv.length?' · '+i.lv.join('·'):''}</small></div></div>`).join(''):'<div class="pick"><small>선택한 수준에 해당하는 최상위 항목이 없어요</small></div>')+'</div>';
  }
  const ups=APP.updates.slice(0,3);
  if(ups.length){h+='<div class="card" data-view="updates"><h2>최근 업데이트<span>더 보기 &#8250;</span></h2>'+ups.map(e=>`<div class="pick"><div><b>[${esc(e.topic)}] ${esc(e.detail)}</b><small>${e.date.slice(0,10)} · ${TYPE[e.type]||e.type}</small></div></div>`).join('')+'</div>';}
  return h;
}
function renderUpdates(){
  if(!APP.updates.length) return '<div class="empty">아직 업데이트가 없어요</div>';
  let h='',last='';
  for(const e of APP.updates){
    const d=e.date.slice(0,10);
    if(d!==last){h+=`<div class="dh">${d}</div>`;last=d}
    const isNew=seenPrev&&e.date>seenPrev;
    const dir=e.dir==='up'?'<span class="badge up">&#9650; 상승</span>':e.dir==='down'?'<span class="badge down">&#9660; 하락</span>':'';
    h+=`<button class="ev" data-goto="${e.key}"><div class="meta">${isNew?'<span class="badge new">NEW</span>':''}<span class="badge">${TYPE[e.type]||e.type}</span>${dir}<span>${esc(e.topic)}</span></div><b>${esc(e.detail)}</b><div class="meta">${esc(e.title)}</div></button>`;
  }
  return h;
}
function render(){
  if(state.view==='updates'&&APP.updates.length){LS.set('seenAt',APP.updates[0].date)}
  renderChrome();
  $('#main').innerHTML=state.view==='tier'?renderTier():state.view==='updates'?renderUpdates():renderHome();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-toggle],[data-topic],[data-level],[data-view],[data-goto],#sbtn,#reload');
  if(!t)return;
  if(t.id==='reload'){location.reload();return}
  if(t.id==='sbtn'){const r=$('#srow');r.classList.toggle('on');if(r.classList.contains('on'))$('#q').focus();else{state.q='';$('#q').value='';render()}return}
  if(t.dataset.toggle!==undefined){const a=t.closest('.it');const id=a.dataset.id;if(state.open.has(id)){state.open.delete(id);a.classList.remove('open')}else{state.open.add(id);a.classList.add('open')}t.setAttribute('aria-expanded',a.classList.contains('open'));return}
  if(t.dataset.topic){state.topic=t.dataset.topic;LS.set('topic',state.topic);go('tier',state.topic);window.scrollTo(0,0);return}
  if(t.dataset.level){state.level=t.dataset.level;LS.set('level',state.level);render();return}
  if(t.dataset.view){if(t.dataset.view==='tier')go('tier',state.topic);else go(t.dataset.view);window.scrollTo(0,0);return}
  if(t.dataset.goto){state.topic=t.dataset.goto;LS.set('topic',state.topic);go('tier',state.topic);window.scrollTo(0,0)}
});
$('#q').addEventListener('input',e=>{state.q=e.target.value.trim();$('#main').innerHTML=renderTier()});
window.addEventListener('hashchange',()=>{parseHash();render()});
window.addEventListener('resize',()=>{document.documentElement.style.setProperty('--hh',$('#hd').offsetHeight+'px')});

// 새 버전 감지: 앱으로 돌아올 때마다 확인
async function checkUpdate(){
  try{
    const r=await fetch('../tier_data.json?_='+Date.now(),{cache:'no-store'});
    const d=await r.json();
    if(d.version!==APP.version)$('#toast').classList.add('on');
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
if(seenPrev===null){LS.set('seenAt',APP.updates.length?APP.updates[0].date:APP.generated_at);seenPrev=LS.get('seenAt',null)}
$('#ttl').textContent=APP.title;
parseHash();
if(!location.hash&&LS.get('view',null)==='tier'){}
render();
checkUpdate();
</script>
</body>
</html>
